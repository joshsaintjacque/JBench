name: PR Build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build the test app
        run: ./script/package_app.sh --configuration release --adhoc-sign

      - name: Name the artifact
        id: artifact
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          echo "name=JBench-PR-${{ github.event.pull_request.number }}-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Archive the app
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            dist/JBench.app \
            "dist/${{ steps.artifact.outputs.name }}.zip"

      - name: Upload the test build
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/${{ steps.artifact.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Add download instructions
        shell: bash
        run: |
          {
            echo "### JBench test build"
            echo
            echo "[Download ${{ steps.artifact.outputs.name }}](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "This build is ad-hoc signed, not notarized. macOS may require right-clicking the app and selecting **Open**."
          } >> "$GITHUB_STEP_SUMMARY"
